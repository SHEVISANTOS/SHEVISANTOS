<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Six areas of ICT expertise</title>
  <desc id="desc">An isometric city representing software engineering, system administration, cybersecurity, full-stack web, machine learning, and database administration.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#0b3d2e"/>
    </linearGradient>
    <style>
      .label { font: 700 17px 'DejaVu Sans', sans-serif; fill: #0b3d2e; }
      .small { font: 600 11px 'DejaVu Sans', sans-serif; fill: #52705d; letter-spacing: 1px; }
      .window { fill: #d4af37; opacity: .9; }
      .line { stroke: #d4af37; stroke-width: 2; opacity: .8; }
    </style>
  </defs>
  <path d="M600 18 1148 165 600 312 52 165Z" fill="url(#ground)" stroke="#14532d" stroke-opacity=".18"/>
  <path d="M52 165 600 312v9L52 174Zm1096 0L600 312v9l548-147Z" fill="#0b3d2e" opacity=".08"/>
